<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Library</title>
<style>
:root{--ink:#182923;--muted:#718078;--paper:#f6f7f2;--card:#fff;--green:#27634c;--lime:#d9edaa;--line:#e7ebe4;--amber:#f4c56d;--red:#b64e43}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.shell{max-width:1100px;margin:auto;padding:28px 24px 48px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:38px}.brand{display:flex;gap:12px;align-items:center;font-size:20px;font-weight:750;letter-spacing:-.4px}.logo{width:38px;height:38px;border-radius:12px;background:var(--green);color:white;display:grid;place-items:center;font-size:20px}.tag{font-size:12px;color:var(--muted);background:#e9ede5;padding:7px 12px;border-radius:20px}.hero{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:26px}.eyebrow{color:var(--green);font-size:12px;font-weight:750;letter-spacing:1.4px;text-transform:uppercase;margin:0 0 8px}.hero h1{font-size:clamp(30px,5vw,46px);line-height:1.06;letter-spacing:-1.7px;margin:0}.hero p{margin:10px 0 0;color:var(--muted)}.primary{border:0;background:var(--green);color:#fff;padding:12px 17px;border-radius:10px;font-weight:650;white-space:nowrap;box-shadow:0 5px 12px #27634c22}.primary:hover{background:#1d503c}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:25px 0}.stat{background:var(--card);border:1px solid var(--line);padding:17px 20px;border-radius:14px;display:flex;justify-content:space-between;align-items:center}.stat span{color:var(--muted);font-size:13px}.stat strong{font-size:25px;letter-spacing:-.5px}.stat .dot{width:9px;height:9px;border-radius:50%;background:var(--green);margin-right:auto;margin-left:12px}.toolbar{display:flex;align-items:center;gap:12px;margin:26px 0 14px}.search{position:relative;flex:1}.search:before{content:'⌕';position:absolute;left:14px;top:7px;color:#829087;font-size:23px}.search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px 11px 40px;outline:none}.search input:focus,.field input:focus{border-color:#8cb49a;box-shadow:0 0 0 3px #27634c16}.filters{display:flex;gap:5px;padding:4px;background:#e9ede5;border-radius:10px}.filters button{border:0;background:transparent;padding:7px 12px;border-radius:7px;color:#607067;font-size:13px}.filters button.active{background:#fff;color:var(--ink);box-shadow:0 1px 4px #15291a12}.table-wrap{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.table-head,.book{display:grid;grid-template-columns:minmax(210px,2fr) minmax(120px,1.15fr) minmax(95px,.8fr) 100px;gap:18px;align-items:center;padding:13px 19px}.table-head{font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:#8a968e;background:#fbfcf9;border-bottom:1px solid var(--line)}.book{min-height:76px;border-bottom:1px solid var(--line)}.book:last-child{border:0}.booktitle{font-weight:670}.author{color:var(--muted);font-size:13px;margin-top:2px}.genre{font-size:13px;color:#68766e}.status{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:650;padding:5px 9px;border-radius:20px;width:max-content}.status:before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}.available{color:#347250;background:#e8f4e7}.issued{color:#966917;background:#fff3d9}.actions{display:flex;justify-content:flex-end}.action{border:1px solid var(--line);background:white;color:var(--green);font-size:12px;font-weight:650;padding:7px 10px;border-radius:8px}.action:hover{background:#f3f8f1}.empty{padding:48px 20px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:5px}.foot{font-size:12px;color:#929c95;margin-top:15px;text-align:right}.modal{position:fixed;inset:0;background:#10221bc0;display:none;align-items:center;justify-content:center;padding:18px;z-index:2}.modal.open{display:flex}.dialog{width:min(420px,100%);background:white;border-radius:16px;padding:23px;box-shadow:0 24px 80px #07180f44}.dialog-top{display:flex;justify-content:space-between;align-items:start;margin-bottom:18px}.dialog h2{font-size:21px;margin:0;letter-spacing:-.5px}.dialog p{color:var(--muted);font-size:13px;margin:4px 0 0}.close{border:0;background:#f0f3ee;width:30px;height:30px;border-radius:50%;font-size:20px;color:#66746b}.field{display:block;margin:14px 0}.field span{display:block;font-size:12px;font-weight:650;margin-bottom:6px}.field input{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;outline:none}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.secondary{border:1px solid var(--line);background:white;border-radius:9px;padding:10px 14px;color:#526158}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:#18392b;color:white;padding:11px 17px;border-radius:10px;opacity:0;transition:.22s;pointer-events:none;box-shadow:0 8px 22px #10221b30}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:650px){.shell{padding:20px 15px 35px}.top{margin-bottom:28px}.hero{align-items:start;flex-direction:column}.stats{gap:8px}.stat{padding:13px 12px;display:block}.stat strong{display:block;font-size:22px}.stat .dot{display:none}.toolbar{align-items:stretch;flex-direction:column}.filters{justify-content:space-between}.table-head{display:none}.book{grid-template-columns:1fr auto;gap:7px;padding:15px}.genre{grid-column:1}.status{grid-column:1;grid-row:2;align-self:center;margin-top:26px}.actions{grid-column:2;grid-row:1/4;align-self:center}.foot{text-align:left}}
</style>
</head>
<body>
<div class="shell">
  <header class="top"><div class="brand"><div class="logo">▤</div> Little Library</div><div class="tag">LIBRARY DESK&nbsp; · &nbsp;TODAY</div></header>
  <section class="hero"><div><p class="eyebrow">Your reading room</p><h1>Books, in good<br>company.</h1><p>A little place to keep your library in order.</p></div><button class="primary" id="addBtn">＋&nbsp; Add a book</button></section>
  <section class="stats" aria-label="Library summary"><div class="stat"><span>Total books</span><i class="dot"></i><strong id="totalCount">0</strong></div><div class="stat"><span>Available</span><i class="dot" style="background:#86ad70"></i><strong id="availableCount">0</strong></div><div class="stat"><span>On loan</span><i class="dot" style="background:var(--amber)"></i><strong id="issuedCount">0</strong></div></section>
  <div class="toolbar"><label class="search"><input id="search" type="search" placeholder="Search by title or author…" aria-label="Search books"></label><div class="filters" role="group" aria-label="Filter books"><button class="active" data-filter="all">All books</button><button data-filter="available">Available</button><button data-filter="issued">On loan</button></div></div>
  <div class="table-wrap"><div class="table-head"><span>Book</span><span>Author</span><span>Genre</span><span style="text-align:right">Status</span></div><div id="bookList"></div></div>
  <div class="foot">Your collection is saved on this device.</div>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="formTitle"><form class="dialog" id="bookForm"><div class="dialog-top"><div><h2 id="formTitle">Add a book</h2><p>Make a little room on the shelf.</p></div><button type="button" class="close" id="closeBtn" aria-label="Close">×</button></div><label class="field"><span>Book title</span><input name="title" required maxlength="80" placeholder="e.g. The Secret Garden"></label><label class="field"><span>Author</span><input name="author" required maxlength="60" placeholder="e.g. Frances Hodgson Burnett"></label><label class="field"><span>Genre</span><input name="genre" maxlength="40" placeholder="e.g. Fiction"></label><div class="form-actions"><button type="button" class="secondary" id="cancelBtn">Cancel</button><button class="primary" type="submit">Save book</button></div></form></div><div class="toast" id="toast" role="status"></div>
<script>
const seed=[{id:1,title:'The Midnight Library',author:'Matt Haig',genre:'Fiction',issued:false},{id:2,title:'Braiding Sweetgrass',author:'Robin Wall Kimmerer',genre:'Nature',issued:true},{id:3,title:'The Little Prince',author:'Antoine de Saint-Exupéry',genre:'Classic',issued:false},{id:4,title:'Atomic Habits',author:'James Clear',genre:'Nonfiction',issued:false},{id:5,title:'Pride and Prejudice',author:'Jane Austen',genre:'Romance',issued:true}];
let books;try{books=JSON.parse(localStorage.getItem('littleLibraryBooks'))||seed}catch{books=seed}let filter='all';
const list=document.getElementById('bookList'),search=document.getElementById('search');function save(){try{localStorage.setItem('littleLibraryBooks',JSON.stringify(books))}catch{}}
function render(){const q=search.value.trim().toLowerCase();const shown=books.filter(b=>(filter==='all'||(filter==='issued'?b.issued:!b.issued))&&(`${b.title} ${b.author} ${b.genre}`.toLowerCase().includes(q)));document.getElementById('totalCount').textContent=books.length;document.getElementById('availableCount').textContent=books.filter(b=>!b.issued).length;document.getElementById('issuedCount').textContent=books.filter(b=>b.issued).length;if(!shown.length){list.innerHTML='<div class="empty"><strong>No books found</strong>Try another search or add a book to your library.</div>';return}list.innerHTML=shown.map(b=>`<div class="book"><div><div class="booktitle">${esc(b.title)}</div><div class="author">${esc(b.author)}</div></div><div class="genre">${esc(b.genre||'—')}</div><div><span class="status ${b.issued?'issued':'available'}">${b.issued?'On loan':'Available'}</span></div><div class="actions"><button class="action" data-id="${b.id}">${b.issued?'Return':'Lend'}</button></div></div>`).join('');list.querySelectorAll('.action').forEach(btn=>btn.onclick=()=>{const b=books.find(x=>x.id==btn.dataset.id);b.issued=!b.issued;save();render();notify(b.issued?'Book marked as on loan.':'Book returned to the shelf.')})}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const modal=document.getElementById('modal');function close(){modal.classList.remove('open')}document.getElementById('addBtn').onclick=()=>modal.classList.add('open');document.getElementById('closeBtn').onclick=close;document.getElementById('cancelBtn').onclick=close;modal.onclick=e=>{if(e.target===modal)close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});document.getElementById('bookForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget);books.unshift({id:Date.now(),title:f.get('title').trim(),author:f.get('author').trim(),genre:f.get('genre').trim()||'Other',issued:false});save();e.currentTarget.reset();close();render();notify('Book added to your library.')};search.oninput=render;document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{document.querySelector('.filters .active').classList.remove('active');b.classList.add('active');filter=b.dataset.filter;render()});let toastTimer;function notify(message){const t=document.getElementById('toast');t.textContent=message;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200)}render();
</script>
</body></html>
